<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>苏州中支合同台账</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-d: #1d4ed8;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --danger: #dc2626;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  header h1 { font-size: 22px; margin: 4px 0; }
  header p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { font-size: 11px; font-weight: 400; color: var(--muted); }
  .rule {
    background: #eef2ff; color: #3730a3; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label .req { color: var(--danger); }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; color: var(--text); background: #fff;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .radio-group { display: flex; gap: 18px; margin-top: 6px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14px; color: var(--text); cursor: pointer; }
  .radio-group input { width: auto; }
  .field-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .mgr-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .mgr-bar input[type=password] { width: auto; max-width: 170px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  button {
    border: none; border-radius: 8px; padding: 11px 16px; font-size: 14px;
    cursor: pointer; font-family: inherit; transition: .15s;
  }
