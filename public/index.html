<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>苏州中支合同台账</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-d: #1d4ed8;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --danger: #dc2626;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  header h1 { font-size: 22px; margin: 4px 0; }
  header p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { font-size: 11px; font-weight: 400; color: var(--muted); }
  .rule {
    background: #eef2ff; color: #3730a3; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label .req { color: var(--danger); }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; color: var(--text); background: #fff;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .radio-group { display: flex; gap: 18px; margin-top: 6px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14px; color: var(--text); cursor: pointer; }
  .radio-group input { width: auto; }
  .field-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .mgr-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .mgr-bar input[type=password] { width: auto; max-width: 170px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  button {
    border: none; border-radius: 8px; padding: 11px 16px; font-size: 14px;
    cursor: pointer; font-family: inherit; transition: .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; flex: 1; min-width: 160px; font-weight: 600; }
  .btn-primary:hover { background: var(--primary-d); }
  .btn-line { background: #fff; border: 1px solid var(--border); color: var(--text); }
  .btn-line:hover { background: #f9fafb; }
  .btn-ghost { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #fef2f2; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 99;
  }
  .toast.show { opacity: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .code-cell { font-weight: 700; color: var(--primary-d); white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .row-acts { display: flex; gap: 6px; }
  .hist-scroll { max-height: 420px; overflow: auto; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appTitle">苏州中支合同台账</h1>
    <p id="appDesc">按「年 - 3205 - 3 位流水号」自动生成编号，并登记合同信息。数据集中保存在服务器，多人共享、流水号连续。</p>
  </header>

  <!-- 管理者专用 -->
  <div class="card" id="mgrResetCard" style="display:none;">
    <h2>管理者操作 <span class="tag">已登录</span></h2>
    <div class="btns">
      <button class="btn-line btn-sm" id="resetSeqBtn">重置本年流水号</button>
      <button class="btn-ghost btn-sm" id="mgrLogoutBtn">退出管理者</button>
    </div>
  </div>

  <!-- 合同信息 -->
  <div class="card">
    <h2>合同信息 <span class="tag">（除"合同签署日期""丙方"外均为必填；编号自动生成）</span></h2>

    <label>录入人 <span class="req">*</span></label>
    <input type="text" id="f_operator" placeholder="填表人姓名（首次填写后会自动记住）" />

    <label>合同名称 <span class="req">*</span></label>
    <input type="text" id="f_contractName" placeholder="如：2026 年度办公用品采购合同" />

    <div class="grid2">
      <div>
        <label>甲方 <span class="req">*</span></label>
        <input type="text" id="f_partyA" placeholder="甲方单位名称" />
      </div>
      <div>
        <label>乙方 <span class="req">*</span></label>
        <input type="text" id="f_partyB" placeholder="乙方单位名称" />
      </div>
    </div>
    <label>丙方（可选）</label>
    <input type="text" id="f_partyC" placeholder="如无丙方可留空" />

    <div class="grid2">
      <div>
        <label>合同类别 <span class="req">*</span></label>
        <input type="text" id="f_category" placeholder="如：采购 / 服务 / 租赁" />
      </div>
      <div>
        <label>合同签署日期</label>
        <input type="date" id="f_signDate" />
        <div class="field-hint">可不填</div>
      </div>
    </div>

    <label>合同标的 <span class="req">*</span></label>
    <input type="text" id="f_subject" placeholder="即合同所指向的交易内容，如：XX 系统一年的运维服务、XX 办公用品采购、XX 场地租赁等" />

    <div class="grid2">
      <div>
        <label>合同金额（元） <span class="req">*</span></label>
        <input type="number" id="f_amount" placeholder="0.00" />
        <div class="field-hint">如无金额请填 0</div>
      </div>
      <div>
        <label>合同期限 <span class="req">*</span></label>
        <select id="f_term">
          <option value="自签订之日起（无固定期限）">自签订之日起（无固定期限）</option>
          <option value="1 年">1 年</option>
          <option value="2 年">2 年</option>
          <option value="3 年">3 年</option>
          <option value="5 年">5 年</option>
          <option value="10 年">10 年</option>
        </select>
      </div>
    </div>

    <label>合同约定的各方应履行的义务（内容、时间、标准） <span class="req">*</span></label>
    <div class="radio-group">
      <label><input type="radio" name="f_obligations" value="详见合同" checked /> 详见合同</label>
      <label><input type="radio" name="f_obligations" value="其他" /> 其他说明</label>
    </div>
    <textarea id="f_obligationsOther" style="display:none;" placeholder="请填写义务的内容、时间、标准"></textarea>

    <label>合同约定的各方义务的履行情况 <span class="req">*</span></label>
    <div class="radio-group">
      <label><input type="radio" name="f_performance" value="正常" checked /> 正常</label>
      <label><input type="radio" name="f_performance" value="不正常" /> 不正常</label>
    </div>

    <label>合同变更情况 <span class="req">*</span></label>
    <div class="radio-group">
      <label><input type="radio" name="f_change" value="无" checked /> 无</label>
      <label><input type="radio" name="f_change" value="有" /> 有</label>
    </div>
    <textarea id="f_changeDesc" style="display:none;" placeholder="请说明变更内容"></textarea>

    <label>合同是否涉及纠纷及诉讼/仲裁 <span class="req">*</span></label>
    <div class="radio-group">
      <label><input type="radio" name="f_dispute" value="否" checked /> 否</label>
      <label><input type="radio" name="f_dispute" value="是" /> 是</label>
    </div>
    <textarea id="f_disputeDesc" style="display:none;" placeholder="如涉及纠纷，请填写说明"></textarea>

    <div class="grid2">
      <div>
        <label>合同用印时间 <span class="req">*</span></label>
        <input type="date" id="f_sealTime" />
      </div>
    </div>
  </div>

  <!-- 生成 -->
  <div class="card">
    <div class="btns">
      <button class="btn-primary" id="genBtn">生成编号并保存</button>
    </div>
  </div>

  <!-- 历史 -->
  <div class="card">
    <h2>生成记录 <span class="tag" id="histCount"></span></h2>
    <div class="btns" style="margin-bottom:12px;" id="mgrActions">
      <button class="btn-line btn-sm" id="exportBtn">导出 CSV（管理者）</button>
      <button class="btn-ghost btn-sm" id="clearBtn">清空记录（管理者）</button>
    </div>
    <div class="mgr-bar" id="mgrBar">
      <input type="password" id="mgrPw" placeholder="管理者密码" />
      <button class="btn-line btn-sm" id="mgrLoginBtn">管理者登录</button>
      <span class="field-hint">删除仅管理者可用</span>
    </div>
    <div class="hist-scroll">
      <table id="histTable">
        <thead>
          <tr>
            <th>编号</th><th>录入人</th><th>合同名称</th><th>甲方</th><th>乙方</th><th>类别</th><th>签署日期</th><th>用印时间</th><th></th>
          </tr>
        </thead>
        <tbody id="histBody"></tbody>
      </table>
      <div class="empty" id="histEmpty">还没有生成记录</div>
    </div>
  </div>

  <footer>本工具为多人共享版：数据集中保存在服务器（单一数据库），所有访问者看到的是同一份记录，流水号全局连续。</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var managerUnlocked = false;
  var mgrToken = "";
  var records = [];

  var $ = function (id) { return document.getElementById(id); };

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function(){ toast("已复制：" + txt); },
        function(){ fallbackCopy(txt); });
    } else { fallbackCopy(txt); }
  }
  function fallbackCopy(txt) {
    var ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("已复制：" + txt); }
    catch (e) { toast("复制失败，请手动复制"); }
    document.body.removeChild(ta);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function val(id) { var e = $(id); return e ? e.value.trim() : ""; }
  function radioVal(name) {
    var el = document.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : "";
  }

  // ---- API ----
  function api(method, url, body) {
    var headers = {};
    if (body) headers["Content-Type"] = "application/json";
    if (mgrToken) headers["x-manager-token"] = mgrToken;
    return fetch(url, {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      var ct = r.headers.get("Content-Type") || "";
      if (ct.indexOf("application/json") >= 0) return r.json().then(function (j) { return { ok: r.ok, data: j }; });
      return { ok: r.ok, data: null };
    });
  }
  function loadRecords() {
    return api("GET", "/api/records").then(function (res) {
      if (res.ok && res.data && res.data.ok) { records = res.data.records; renderHistory(); }
      else toast("加载记录失败");
    }).catch(function () { toast("无法连接服务器"); });
  }

  // ---- 生成 ----
  function doGenerate() {
    if (!val("f_operator")) { toast("请填写：录入人"); return; }
    if (!val("f_contractName")) { toast("请填写：合同名称"); return; }
    if (!val("f_partyA")) { toast("请填写：甲方"); return; }
    if (!val("f_partyB")) { toast("请填写：乙方"); return; }
    if (!val("f_category")) { toast("请填写：合同类别"); return; }
    if (!val("f_subject")) { toast("请填写：合同标的"); return; }
    if (val("f_amount") === "") { toast("请填写：合同金额（无金额请填 0）"); return; }
    if (!val("f_term")) { toast("请选择：合同期限"); return; }
    if (!val("f_sealTime")) { toast("请填写：合同用印时间"); return; }

    var obligations = radioVal("f_obligations");
    if (obligations === "其他" && !val("f_obligationsOther")) {
      toast("义务请选「详见合同」或填写其他说明"); return;
    }
    var dispute = radioVal("f_dispute");
    if (dispute === "是" && !val("f_disputeDesc")) {
      toast("涉及纠纷，请填写纠纷/诉讼/仲裁说明"); return;
    }
    var change = radioVal("f_change");
    if (change === "有" && !val("f_changeDesc")) {
      toast("合同有变更，请填写变更说明"); return;
    }

    try { localStorage.setItem("hetong_operator", val("f_operator")); } catch (e) {}
    var payload = {
      operator: val("f_operator"),
      contractName: val("f_contractName"),
      partyA: val("f_partyA"),
      partyB: val("f_partyB"),
      partyC: val("f_partyC"),
      category: val("f_category"),
      signDate: val("f_signDate"),
      subject: val("f_subject"),
      amount: val("f_amount"),
      term: val("f_term"),
      obligations: obligations === "其他" ? val("f_obligationsOther") : "详见合同",
      performance: radioVal("f_performance"),
      change: change,
      changeDesc: change === "有" ? val("f_changeDesc") : "",
      dispute: dispute === "是",
      disputeDesc: dispute === "是" ? val("f_disputeDesc") : "",
      sealTime: val("f_sealTime")
    };

    api("POST", "/api/records", payload).then(function (res) {
      if (res.ok && res.data && res.data.ok) {
        var code = res.data.record ? res.data.record.code : res.data.code;
        copyText(code);
        resetForm();
        loadRecords();
        toast("已生成并复制：" + code);
      } else {
        toast(res.data && res.data.msg ? res.data.msg : "生成失败");
      }
    }).catch(function () { toast("网络错误，生成失败"); });
  }

  function resetForm() {
    ["f_contractName","f_partyA","f_partyB","f_partyC","f_category","f_subject","f_amount",
     "f_obligationsOther","f_changeDesc","f_disputeDesc","f_signDate","f_sealTime"].forEach(function (id) { if ($(id)) $(id).value = ""; });
    ["f_obligationsOther","f_changeDesc","f_disputeDesc"].forEach(function (id) { if ($(id)) $(id).style.display = "none"; });
    var def = {
      "f_obligations": "详见合同", "f_performance": "正常", "f_change": "无", "f_dispute": "否"
    };
    Object.keys(def).forEach(function (n) {
      var el = document.querySelector('input[name="' + n + '"][value="' + def[n] + '"]');
      if (el) el.checked = true;
    });
  }

  function renderHistory() {
    var body = $("histBody");
    body.innerHTML = "";
    $("histCount").textContent = records.length ? "（共 " + records.length + " 条）" : "";
    $("histEmpty").style.display = records.length ? "none" : "block";
    records.forEach(function (r) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="code-cell">' + esc(r.code) + '</td>' +
        '<td>' + esc(r.operator || "—") + '</td>' +
        '<td>' + esc(r.contractName || "—") + '</td>' +
        '<td>' + esc(r.partyA || "—") + '</td>' +
        '<td>' + esc(r.partyB || "—") + '</td>' +
        '<td>' + esc(r.category || "—") + '</td>' +
        '<td>' + esc(r.signDate || "—") + '</td>' +
        '<td>' + esc(r.sealTime || "—") + '</td>' +
        '<td><div class="row-acts">' +
          '<button class="btn-line btn-sm" data-act="copy" data-id="' + r.id + '">复制</button>' +
          '<button class="btn-ghost btn-sm" data-act="del" data-id="' + r.id + '"' + (managerUnlocked ? '' : ' style="display:none;"') + '>删</button>' +
        '</div></td>';
      body.appendChild(tr);
    });
  }

  function applyLock() {
    $("mgrActions").style.display = managerUnlocked ? "flex" : "none";
    $("mgrBar").style.display = managerUnlocked ? "none" : "flex";
    $("mgrResetCard").style.display = managerUnlocked ? "block" : "none";
  }

  // ---- 事件 ----
  $("genBtn").addEventListener("click", doGenerate);

  document.querySelectorAll('input[name="f_obligations"]').forEach(function (el) {
    el.addEventListener("change", function () {
      $("f_obligationsOther").style.display = radioVal("f_obligations") === "其他" ? "block" : "none";
    });
  });
  document.querySelectorAll('input[name="f_change"]').forEach(function (el) {
    el.addEventListener("change", function () {
      $("f_changeDesc").style.display = radioVal("f_change") === "有" ? "block" : "none";
    });
  });
  document.querySelectorAll('input[name="f_dispute"]').forEach(function (el) {
    el.addEventListener("change", function () {
      $("f_disputeDesc").style.display = radioVal("f_dispute") === "是" ? "block" : "none";
    });
  });

  $("resetSeqBtn").addEventListener("click", function () {
    if (!confirm("确定将 " + new Date().getFullYear() + " 年的流水号重置为 1 吗？")) return;
    api("POST", "/api/reset-seq", { year: new Date().getFullYear() })
      .then(function (res) {
        if (res.ok && res.data && res.data.ok) toast(new Date().getFullYear() + " 年流水号已重置");
        else toast(res.data && res.data.msg ? res.data.msg : "重置失败");
      }).catch(function () { toast("网络错误"); });
  });

  $("exportBtn").addEventListener("click", function () {
    downloadBlob("/api/export/csv", "苏州中支合同台账_" + new Date().toISOString().slice(0, 10) + ".csv");
  });
  $("clearBtn").addEventListener("click", function () {
    if (!records.length) { toast("暂无记录"); return; }
    if (!confirm("确定清空所有生成记录吗？（编号流水号不受影响）")) return;
    api("POST", "/api/clear", {}).then(function (res) {
      if (res.ok && res.data && res.data.ok) { records = []; renderHistory(); toast("已清空记录"); }
      else toast(res.data && res.data.msg ? res.data.msg : "清空失败");
    }).catch(function () { toast("网络错误"); });
  });

  $("histBody").addEventListener("click", function (e) {
    var btn = e.target.closest("button"); if (!btn) return;
    var id = btn.getAttribute("data-id");
    var act = btn.getAttribute("data-act");
    if (act === "copy") {
      var r = records.find(function (x) { return x.id === id; });
      if (r) copyText(r.code);
    } else if (act === "del") {
      if (!confirm("删除该记录？")) return;
      api("DELETE", "/api/records/" + id, null).then(function (res) {
        if (res.ok && res.data && res.data.ok) { loadRecords(); toast("已删除"); }
        else toast(res.data && res.data.msg ? res.data.msg : "删除失败");
      }).catch(function () { toast("网络错误"); });
    }
  });

  $("mgrLoginBtn").addEventListener("click", function () {
    var pw = $("mgrPw").value;
    if (!pw) { toast("请输入管理者密码"); return; }
    api("POST", "/api/login", { pw: pw }).then(function (res) {
      if (res.ok && res.data && res.data.ok) {
        managerUnlocked = true; mgrToken = res.data.token;
        try { sessionStorage.setItem("mgrToken", mgrToken); } catch (e) {}
        $("mgrPw").value = "";
        applyLock(); renderHistory(); toast("已进入管理者模式");
      } else { toast("密码错误"); }
    }).catch(function () { toast("网络错误"); });
  });
  $("mgrPw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("mgrLoginBtn").click(); });

  $("mgrLogoutBtn").addEventListener("click", function () {
    managerUnlocked = false; mgrToken = "";
    try { sessionStorage.removeItem("mgrToken"); } catch (e) {}
    applyLock(); renderHistory(); toast("已退出管理者模式");
  });

  // 初始化
  try { var savedOp = localStorage.getItem("hetong_operator"); if (savedOp && $("f_operator")) $("f_operator").value = savedOp; } catch (e) {}
  try { mgrToken = sessionStorage.getItem("mgrToken") || ""; } catch (e) {}
  if (mgrToken) managerUnlocked = true;
  applyLock();
  loadRecords();

  // 读取本实例配置（标题 / 机构固定码），实现一份代码多分公司共用
  fetch("/api/config").then(function (r) { return r.json(); }).then(function (cfg) {
    if (!cfg || !cfg.ok) return;
    if (cfg.title) {
      document.title = cfg.title;
      if ($("appTitle")) $("appTitle").textContent = cfg.title;
    }
    if (cfg.fixed && $("appDesc")) {
      $("appDesc").textContent = "按「年 - " + cfg.fixed + " - 3 位流水号」自动生成编号，并登记合同信息。数据集中保存在服务器，多人共享、流水号连续。";
    }
  }).catch(function () {});

  function downloadBlob(url, filename) {
    var headers = mgrToken ? { "x-manager-token": mgrToken } : undefined;
    fetch(url, { headers: headers }).then(function (r) {
      if (!r.ok) return r.json().then(function (e) { throw new Error(e.msg || "下载失败"); });
      return r.blob();
    }).then(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      toast("已开始下载：" + filename);
    }).catch(function (e) { toast(e.message || "下载失败"); });
  }
})();
</script>
</body>
</html>
